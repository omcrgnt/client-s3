# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: 3

vars:
  DOCKER_IMAGE: golang:alpine
  COMPOSE_FILE: docker/service/minio.yml

tasks:
  deps:up:
    desc: Start MinIO (+ init bucket) via docker/service/minio.yml
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d

  deps:down:
    desc: Stop MinIO compose fragment
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  test-u:
    desc: Unit tests (race)
    cmds:
      - |
        docker run --rm \
          -v "{{.USER_WORKING_DIR}}:/workspace" \
          -w /workspace \
          {{.DOCKER_IMAGE}} \
          sh -c "apk add --no-cache build-base git && GOWORK=off go test -race -v ./..."

  test:
    desc: All tests (unit)
    cmds:
      - task: test-u

  doc:
    desc: "Package docs (pkgsite) at http://localhost:8080/github.com/omcrgnt/client-s3"
    interactive: true
    cmds:
      - |
        docker run --rm -it --init -p 8080:8080 \
          -v "{{.USER_WORKING_DIR}}:/workspace" \
          -w /workspace \
          {{.DOCKER_IMAGE}} \
          sh -c "apk add --no-cache git && \
            exec go run golang.org/x/pkgsite/cmd/pkgsite@latest -http=0.0.0.0:8080"
